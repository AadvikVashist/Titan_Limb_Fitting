[project]
name = "titan-limb-fitting"
version = "0.1.0"
description = "Cassini VIMS limb-profile analysis for Titan"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "matplotlib>=3.11.1,<4",
  "numpy>=2.5.2,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "polars>=1.44.1,<2",
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.10,<3",
  "pyarrow>=18,<23",
  "pyvims>=1.1.1,<2",
  "scikit-learn>=1.9,<2",
  "scipy>=1.18.1,<2",
  "seaborn>=0.13.2,<0.14",
  "typer>=0.16,<1",
  "xarray>=2025.1",
  "zarr>=3,<4",
]

[project.scripts]
titan-limb = "titan_limb.cli:app"

[dependency-groups]
dev = [
  "hypothesis>=6.130",
  "pre-commit>=4.3",
  "pytest>=8.4",
  "pytest-cov>=7",
  "ruff>=0.14",
  "ty>=0.0.38",
]
notebook = [
  "ipykernel>=7",
  "jupyterlab>=4.4",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/titan_limb"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["fitting_code"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PERF", "PL", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["titan_limb"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ty.environment]
python-version = "3.12"

