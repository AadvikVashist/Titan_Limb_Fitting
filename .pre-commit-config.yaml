repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: uv run ruff check --fix src tests
        language: system
        pass_filenames: false
        types: [python]

      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format src tests
        language: system
        pass_filenames: false
        types: [python]

      - id: ty
        name: Python type check
        entry: uv run ty check src tests
        language: system
        pass_filenames: false
        types: [python]

